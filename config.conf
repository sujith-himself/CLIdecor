# ╔══════════════════════════════════════════════════════════╗
# ║                   CLI DECOR CONFIG                       ║
# ║                                                          ║
# ║  All settings here are loaded instantly on next run.     ║
# ║  Set values to 1 (show) or 0 (hide) for info modules.    ║
# ╚══════════════════════════════════════════════════════════╝

# ── Info Modules ──────────────────────────────────────────
show_os=1          # Show the Operating System name
show_host=1        # Show the machine model / hostname
show_kernel=1      # Show the Kernel version
show_uptime=1      # Show system Uptime
show_packages=1    # Show installed package count
show_shell=1       # Show current shell name and version
show_terminal=1    # Show terminal emulator name
show_resolution=1  # Show screen resolution
show_cpu=1         # Show CPU model and usage bar
show_gpu=1         # Show GPU model
show_memory=1      # Show RAM usage and bar
show_swap=1        # Show swap space usage
show_disk=1        # Show disk space and usage
show_battery=0     # Show battery percentage (if applicable)
show_localip=1     # Show local IP address (LAN)
show_publicip=0    # Show public IP address (WAN)
show_locale=1      # Show system locale
show_bars=1        # Toggle usage bars for CPU, RAM, Disk

# ── Appearance & Themes ───────────────────────────────────
# Available themes: default, hacker, dracula, nord, fire, gold, chameleon
# 'chameleon' automatically matches the colors of your custom image!
theme=default

# ── Reminder Box ──────────────────────────────────────────
# Set this to a string to pin a sticky note at the bottom of the output
# Leave it blank to disable the reminder box
reminder_text=

# ── Custom Image Art ──────────────────────────────────────
# Absolute path to your custom image (PNG/JPG/BMP/WEBP)
# Leave blank to use the default ASCII distro logo
image_path=

# Image width in terminal columns (default: 28)
image_width=28

# Style: 'color' uses half-block ▀/▄ TrueColor rendering (recommended)
# 'ascii' uses colored Braille rendering for higher density
image_style=color

# Zoom / Scale multipliers (default: 1.0)
image_scale_x=1.0
image_scale_y=1.0

# Padding inside the image container
image_pad_x=0
image_pad_y=0

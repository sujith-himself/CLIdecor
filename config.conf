# CLI DECOR config
# Comment out (add # in front) any line you don't want shown.
# Reorder lines to reorder the info panel.
# custom_text can be edited freely.

show_os=1
show_host=1
show_kernel=1
show_uptime=1
show_packages=1
show_shell=1
show_terminal=1
show_resolution=1
show_cpu=1
show_gpu=1
show_memory=1
show_swap=1
show_disk=1
show_battery=0
show_localip=1
show_publicip=0
show_locale=1
show_bars=1

# Themes: default, hacker, dracula, nord, fire, gold
theme=default

# Persistent reminder box (leave empty to disable)
reminder_text=

# Path to an image for the side art. Leave blank to use default ascii logo.
image_path=

# Image customization
image_style=color
image_width=28
pixel_size=1
image_blur=0
image_scale_x=1.0
image_scale_y=1.0
image_pad_x=0
image_pad_y=0


